[project]
name = "cervantes-vivo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1", "anthropic>=0.49,<1"]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
